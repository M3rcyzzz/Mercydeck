<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deck 标题</title>
<style>
/* mercydeck · factory-software baseline
   Fixed 1600 × 900 composition; fit the stage, never shrink overflowing content.
   Fonts are system fallbacks. For exact metrics, embed licensed IBM Plex Sans SC
   / IBM Plex Mono WOFF2 as data URLs or bundle them under assets/ with @font-face.
   Do not load fonts, scripts, or images from a CDN. */
:root {
  --paper: #fff;
  --ink: #050B14;
  --muted: #73777D;
  --accent: #B2ED1D;
  --accent-text: #73B200;
  --type-display: 128px;
  --type-title: 80px;
  --type-body: 48px;
  --sans: "IBM Plex Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --mono: "IBM Plex Mono", Menlo, Consolas, monospace;
  --ease: cubic-bezier(.22, 1, .36, 1);
}
* { box-sizing: border-box; }
html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
body { background: #e9e9e7; color: var(--ink); font: 400 var(--type-body)/1.2 var(--sans); -webkit-font-smoothing: antialiased; }
h1, h2, h3, p, figure, dl, dd { margin: 0; font-weight: 400; }
strong { font-weight: 400; }
a { color: inherit; }
button, a, video { touch-action: manipulation; }
a:focus-visible, button:focus-visible, video:focus-visible { outline: 3px solid var(--accent-text); outline-offset: 4px; }
#viewport { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; }
#screen { position: relative; flex: none; width: 1600px; height: 900px; overflow: hidden; background: var(--paper); }
#deck { position: absolute; inset: 0; width: 1600px; height: 900px; transform-origin: top left; }
.slide { position: absolute; inset: 0; width: 1600px; height: 900px; display: none; overflow: hidden; background: var(--paper); }
.slide.active { display: block; }
.canvas-card { position: relative; width: 100%; height: 100%; padding: 80px; }
.title { font-size: var(--type-title); line-height: 1.12; letter-spacing: -.045em; }
.display { font-size: var(--type-display); line-height: 1.12; letter-spacing: -.045em; }
.body-text { font-size: var(--type-body); line-height: 1.2; letter-spacing: -.025em; }
.signal { color: var(--accent-text); }
.mark { background: var(--accent); color: var(--ink); padding: 0 .08em; }
.muted { color: var(--muted); }
.brand { position: absolute; left: 80px; top: 80px; font-size: var(--type-body); letter-spacing: -.035em; }
.cover-title { position: absolute; left: 80px; right: 80px; top: 320px; }
.speaker { position: absolute; left: 80px; top: 512px; display: flex; flex-direction: column; gap: 12px; }
.statement { position: absolute; left: 80px; right: 80px; top: 320px; }
.statement .body-text { margin-top: 48px; max-width: 1240px; }
.terms { position: absolute; left: 80px; right: 80px; top: 320px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 48px; }
.terms dt { font-size: var(--type-display); line-height: 1.1; letter-spacing: -.065em; }
.terms dd { margin-top: 40px; font-size: var(--type-body); line-height: 1.2; letter-spacing: -.035em; }
/* All text and states exist in the source DOM. Step changes only set attributes. */
.reveal { opacity: 0; visibility: hidden; pointer-events: none; transform: translateY(14px); transition: opacity 280ms ease, transform 500ms var(--ease), visibility 0s 500ms; }
.reveal.is-current { opacity: 1; visibility: visible; pointer-events: auto; transform: none; transition-delay: 0s; }
.focus-scene { position: absolute; left: 80px; top: 250px; width: 1440px; height: 480px; transform-origin: 720px 240px; transition: transform 1000ms var(--ease); }
.focus-scene svg { display: block; width: 100%; height: 100%; }
.focus-labels { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(3, 1fr); align-items: center; text-align: center; }
.focus-labels p { font-size: var(--type-body); }
.scene-context { opacity: 1; transition: opacity 360ms ease; }
.scene-target { fill: #F3F4F1; transition: fill 360ms ease; }
.focus-slide[data-step="1"] .focus-scene { transform: scale(1.75); }
.focus-slide[data-step="1"] .scene-context { opacity: .12; }
.focus-slide[data-step="1"] .focus-labels .scene-context { opacity: 0; visibility: hidden; }
.focus-slide[data-step="1"] .scene-target { fill: #D4F58C; }
.focus-caption { position: absolute; left: 80px; bottom: 80px; }
.media-stage { position: absolute; inset: 80px; overflow: hidden; background: #F3F4F1; }
.video-placeholder { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; gap: 48px; padding: 80px; }
.demo-video { display: none; width: 100%; height: 100%; object-fit: contain; background: #F3F4F1; }
.media-stage.has-video .demo-video { display: block; }
.media-stage.has-video .video-placeholder { display: none; }
.dual-video-grid { position: absolute; left: 80px; right: 80px; top: 286px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 32px; }
.video-slot-title { margin-bottom: 28px; }
.dual-video-grid .media-stage { position: relative; inset: auto; width: 100%; aspect-ratio: 16 / 9; }
.dual-video-grid .video-placeholder { padding: 48px; gap: 0; }
.dual-video-grid .demo-video { position: absolute; inset: 0; }
.status-live { position: fixed; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
/* No always-on HUD. The host may inject its own touch navigation. */
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }
@media print {
  @page { size: 1600px 900px; margin: 0; }
  html, body { height: auto; overflow: visible; background: #fff; }
  #viewport, #screen, #deck { position: static; display: block; width: 1600px !important; height: auto !important; transform: none !important; overflow: visible; }
  .slide { position: relative; display: block !important; break-after: page; print-color-adjust: exact; -webkit-print-color-adjust: exact; }
  .slide:last-child { break-after: auto; }
  .reveal { opacity: 1; visibility: visible; transform: none; }
  /* Print the text state for overlapping single-video slides. */
  .single-video > .media-stage { display: none; }
  .focus-scene { transform: none !important; }
  .scene-context { opacity: 1 !important; }
  .focus-labels .scene-context { visibility: visible !important; }
}
</style>
</head>
<body>
<main id="viewport" aria-label="演示文稿">
  <div id="screen"><div id="deck" tabindex="-1">

    <!-- 1 · White cover. Replace this placeholder brand with a supplied local logo. -->
    <section class="slide cover active" data-title="封面" data-step="0" data-max-step="0" aria-label="第 1 页，封面">
      <p class="brand">品牌名称</p>
      <h1 class="cover-title display">一句话讲清核心主题</h1>
      <div class="speaker body-text"><p>演讲者姓名</p><p>身份或组织</p></div>
    </section>

    <!-- 2 · One assertion; one deliberate reveal, not a list of small bullets. -->
    <section class="slide" data-title="核心论断" data-step="0" data-max-step="1" aria-label="第 2 页，核心论断">
      <div class="statement">
        <h2 class="display">让<span class="signal">核心判断</span><br>成为这一页的主角</h2>
        <p class="body-text reveal" data-step-min="1">补充一句解释，让观众理解这个判断。</p>
      </div>
    </section>

    <!-- 3 · Three terms: equal columns, large names, one-line explanations. -->
    <section class="slide" data-title="三个术语" data-step="0" data-max-step="1" aria-label="第 3 页，三个术语">
      <div class="canvas-card"><h2 class="title">三个关键词，建立共同语言</h2></div>
      <dl class="terms">
        <div><dt>术语一</dt><dd class="reveal" data-step-min="1">一句解释</dd></div>
        <div><dt>术语二</dt><dd class="reveal" data-step-min="1">一句解释</dd></div>
        <div><dt>术语三</dt><dd class="reveal" data-step-min="1">一句解释</dd></div>
      </dl>
    </section>

    <!-- 4 · Original schematic, not a product screenshot. Labels stay editable HTML. -->
    <section class="slide focus-slide" data-title="聚焦图解" data-step="0" data-max-step="1" aria-label="第 4 页，聚焦图解">
      <div class="canvas-card"><h2 class="title">先看全貌，再看关键环节</h2></div>
      <figure class="focus-scene" aria-label="三个相连环节的概念示意图">
        <svg viewBox="0 0 1440 480" aria-hidden="true">
          <g class="scene-context" fill="none" stroke="#C8CDCA" stroke-width="3">
            <path d="M420 240H540M900 240H1020"/>
            <path d="M504 222L528 240L504 258M984 222L1008 240L984 258"/>
            <rect x="60" y="110" width="360" height="260" rx="8" fill="#F3F4F1" stroke="none"/>
            <rect x="1020" y="110" width="360" height="260" rx="8" fill="#F3F4F1" stroke="none"/>
          </g>
          <rect class="scene-target" x="540" y="110" width="360" height="260" rx="8"/>
          <path d="M624 324H816" stroke="#73B200" stroke-width="4"/>
        </svg>
        <div class="focus-labels"><p class="scene-context">起点</p><p>关键环节</p><p class="scene-context">结果</p></div>
      </figure>
      <p class="focus-caption body-text reveal" data-step-min="1">把注意力留给一个关键关系。</p>
    </section>

    <!-- 5 · Title → full media. Add src="videos/demo.mp4" only after adding the file.
         Keep native controls, muted, playsinline and preload="metadata"; add loop only when needed.
         An empty slot intentionally makes no media request. -->
    <section class="slide single-video" data-title="单视频演示" data-step="0" data-max-step="1" aria-label="第 5 页，单视频演示">
      <div class="canvas-card reveal" data-step-min="0" data-step-max="0"><h2 class="title">用演示回答一个问题</h2></div>
      <div class="statement reveal" data-step-min="0" data-step-max="0"><p class="display">先说清楚<br>观众要看什么</p></div>
      <figure class="media-stage reveal" data-step-min="1" aria-label="演示视频">
        <div class="video-placeholder"><h3 class="title">演示视频</h3><p class="body-text muted">视频素材待补充</p></div>
        <video class="demo-video" muted playsinline preload="metadata" controls aria-label="演示视频播放控件"></video>
      </figure>
    </section>

    <!-- 6 · Compare two real recordings; neither slot requests a missing asset. -->
    <section class="slide" data-title="双视频对比" data-step="0" data-max-step="0" aria-label="第 6 页，双视频对比">
      <div class="canvas-card"><h2 class="title">让差异自己说话</h2></div>
      <div class="dual-video-grid">
        <div><h3 class="video-slot-title body-text">对比维度一</h3>
          <figure class="media-stage" aria-label="第一段演示视频">
            <div class="video-placeholder"><p class="body-text muted">视频素材待补充</p></div>
            <video class="demo-video" muted playsinline preload="metadata" controls aria-label="第一段视频播放控件"></video>
          </figure>
        </div>
        <div><h3 class="video-slot-title body-text">对比维度二</h3>
          <figure class="media-stage" aria-label="第二段演示视频">
            <div class="video-placeholder"><p class="body-text muted">视频素材待补充</p></div>
            <video class="demo-video" muted playsinline preload="metadata" controls aria-label="第二段视频播放控件"></video>
          </figure>
        </div>
      </div>
    </section>

    <!-- 7 · Quiet white ending; a real, supplied call to action can replace the last line. -->
    <section class="slide" data-title="收尾" data-step="0" data-max-step="0" aria-label="第 7 页，收尾">
      <p class="brand">品牌名称</p>
      <div class="statement"><h2 class="display">记住这<span class="signal">一个判断</span></h2><p class="body-text">一个明确、可执行的下一步。</p></div>
    </section>

  </div></div>
</main>
<p id="live-status" class="status-live" role="status" aria-live="polite"></p>
<script>
(() => {
  'use strict';
  const viewport = document.getElementById('viewport');
  const screen = document.getElementById('screen');
  const deck = document.getElementById('deck');
  const slides = [...deck.querySelectorAll(':scope > .slide')];
  const videos = [...deck.querySelectorAll('video')];
  const status = document.getElementById('live-status');
  const interactive = 'a,button,video,audio,input,textarea,select,label,summary,[role="button"],[contenteditable]:not([contenteditable="false"]),[data-no-nav]';
  let page = 0, clickTimer = 0, touchStart = null, suppressClickUntil = 0;
  const maxStep = slide => Math.max(0, Number(slide.dataset.maxStep) || 0);
  const step = () => Number(slides[page].dataset.step) || 0;
  const editing = () => !!document.querySelector('style[data-deckedit]');
  const isInteractive = target => target instanceof Element && !!target.closest(interactive);
  const hasSource = video => !!(video.getAttribute('src')?.trim() || video.querySelector('source[src]:not([src=""])'));

  function fit() {
    const scale = Math.max(.01, Math.min(viewport.clientWidth / 1600, viewport.clientHeight / 900));
    screen.style.width = `${1600 * scale}px`;
    screen.style.height = `${900 * scale}px`;
    deck.style.transform = `scale(${scale})`;
  }
  function visibleMedia(video) {
    if (document.hidden || !video.closest('.slide')?.classList.contains('active')) return false;
    for (let parent = video.parentElement; parent && parent !== deck; parent = parent.parentElement) {
      if (parent.classList.contains('reveal') && !parent.classList.contains('is-current')) return false;
    }
    return hasSource(video) && !video.closest('.media-stage')?.classList.contains('media-error');
  }
  function syncMedia(restart = false) {
    videos.forEach(video => {
      const slot = video.closest('.media-stage');
      slot?.classList.toggle('has-video', hasSource(video) && !slot.classList.contains('media-error'));
      if (!visibleMedia(video)) { video.pause(); return; }
      if (restart) { try { video.currentTime = 0; } catch { /* Wait for metadata if necessary. */ } }
      const playback = video.play();
      playback?.catch(error => {
        if (error.name !== 'AbortError' && visibleMedia(video)) status.textContent = '请使用视频原生控件开始播放。';
      });
    });
  }
  function renderStep(slide, value) {
    const current = Math.max(0, Math.min(maxStep(slide), value));
    slide.dataset.step = String(current);
    slide.querySelectorAll('.reveal').forEach(element => {
      const from = Number(element.dataset.stepMin) || 0;
      const until = element.hasAttribute('data-step-max') ? Number(element.dataset.stepMax) : Infinity;
      const visible = current >= from && current <= until;
      element.classList.toggle('is-current', visible);
      element.setAttribute('aria-hidden', String(!visible));
      element.inert = !visible;
    });
  }
  function announce() {
    status.textContent = `第 ${page + 1} 页，共 ${slides.length} 页，${slides[page].dataset.title}，第 ${step() + 1} 步。`;
  }
  function go(index, position = 0) {
    clearTimeout(clickTimer);
    videos.forEach(video => video.pause());
    page = Math.max(0, Math.min(slides.length - 1, Math.trunc(index)));
    slides.forEach((slide, i) => {
      const active = i === page;
      slide.classList.toggle('active', active);
      slide.setAttribute('aria-hidden', String(!active));
      slide.inert = !active;
    });
    renderStep(slides[page], position);
    // The editor loads srcdoc under a <base>; its about: URL cannot be replaced.
    if (location.protocol !== 'about:') {
      try { const url = new URL(location.href); url.hash = String(page + 1); history.replaceState(null, '', url); }
      catch (error) { if (error.name !== 'SecurityError') throw error; }
    }
    announce(); fit(); syncMedia(true);
  }
  function advance(direction) {
    clearTimeout(clickTimer);
    if (direction > 0) {
      if (step() < maxStep(slides[page])) renderStep(slides[page], step() + 1);
      else if (page < slides.length - 1) { go(page + 1); return; }
    } else {
      if (step() > 0) renderStep(slides[page], step() - 1);
      else if (page > 0) { go(page - 1, maxStep(slides[page - 1])); return; }
    }
    announce(); syncMedia(true);
  }

  // The host's #__deck-navbtns and editor buttons dispatch synthetic keys on body.
  // Handle those normally; preventDefault signals that the deck consumed the key.
  document.addEventListener('keydown', event => {
    if (event.defaultPrevented || event.metaKey || event.ctrlKey || event.altKey || event.repeat || isInteractive(event.target)) return;
    if (['ArrowRight', 'ArrowDown', 'PageDown', ' '].includes(event.key)) { event.preventDefault(); advance(1); }
    else if (['ArrowLeft', 'ArrowUp', 'PageUp', 'Backspace'].includes(event.key)) { event.preventDefault(); advance(-1); }
    else if (event.key === 'Home') { event.preventDefault(); go(0); }
    else if (event.key === 'End') { event.preventDefault(); go(slides.length - 1); }
    else if (event.key.toLowerCase() === 'r') { event.preventDefault(); renderStep(slides[page], 0); announce(); syncMedia(true); }
  });
  // Click blank stage edges: left 15% back, right 40% forward. Delay single-click
  // navigation so a double click can be used by an editor without changing pages.
  deck.addEventListener('click', event => {
    clearTimeout(clickTimer);
    if (event.defaultPrevented || event.detail > 1 || editing() || isInteractive(event.target) || performance.now() < suppressClickUntil) return;
    if (getSelection()?.toString().trim()) return;
    const bounds = deck.getBoundingClientRect();
    const x = (event.clientX - bounds.left) / bounds.width;
    const direction = x < .15 ? -1 : x > .6 ? 1 : 0;
    if (direction) clickTimer = setTimeout(() => { if (!editing() && !getSelection()?.toString().trim()) advance(direction); }, 300);
  });
  deck.addEventListener('dblclick', () => clearTimeout(clickTimer));
  deck.addEventListener('touchstart', event => {
    touchStart = null;
    if (editing() || isInteractive(event.target) || event.touches.length !== 1) return;
    clearTimeout(clickTimer);
    touchStart = { x: event.touches[0].clientX, y: event.touches[0].clientY };
  }, { passive: true });
  deck.addEventListener('touchend', event => {
    if (!touchStart || !event.changedTouches.length) return;
    const dx = event.changedTouches[0].clientX - touchStart.x;
    const dy = event.changedTouches[0].clientY - touchStart.y;
    touchStart = null;
    if (Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.5) {
      suppressClickUntil = performance.now() + 700;
      if (!editing()) advance(dx < 0 ? 1 : -1);
    }
  }, { passive: true });
  deck.addEventListener('touchcancel', () => { touchStart = null; });
  videos.forEach(video => {
    // The editor saves live DOM. A previous load error is not authored content.
    video.closest('.media-stage')?.classList.remove('media-error');
    video.addEventListener('error', () => {
      video.closest('.media-stage')?.classList.add('media-error');
      status.textContent = '视频无法播放，请检查本地媒体文件。';
      syncMedia();
    });
    video.addEventListener('loadedmetadata', () => {
      video.closest('.media-stage')?.classList.remove('media-error');
      syncMedia();
    });
  });
  document.addEventListener('visibilitychange', () => syncMedia());
  window.addEventListener('resize', fit);
  document.addEventListener('fullscreenchange', fit);
  window.addEventListener('hashchange', () => go((Number(location.hash.slice(1)) || 1) - 1));
  new ResizeObserver(fit).observe(viewport);
  document.fonts?.ready.then(fit);
  // A saved live DOM may contain transient step/classes: reset every slide first.
  slides.forEach(slide => renderStep(slide, 0));
  go((Number(location.hash.slice(1)) || 1) - 1);
})();
</script>
</body>
</html>
